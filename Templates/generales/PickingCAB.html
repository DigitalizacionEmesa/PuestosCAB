<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Picking CAB</title>
  <link rel="stylesheet" href="/assets/css/global-styles.css?v=1.0">
  <link rel="stylesheet" href="/assets/css/loginModal.css?v=20260908-cab-pe-widget-2">
  <link rel="stylesheet" href="/assets/css/styles.css?v=1.0">
  <link rel="stylesheet" href="/assets/css/SelectorMultiple.css?v=1.0">
  <style>
    :root { font-family: 'Open Sans', Arial, sans-serif; color: #244f75; background: #e6f2fb; }
    body { margin: 0; min-height: 100vh; background: #e6f2fb; }
    .header { position: sticky; top: 0; z-index: 5; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: #3880c7; color: white; box-shadow: 0 2px 8px #174f7b33; }
    .header-title { font-size: 1.25rem; font-weight: 700; text-align: center; }
    .header-action { width: 42px; height: 42px; display: grid; place-items: center; color: white; border: 0; background: transparent; cursor: pointer; font-size: 1.8rem; text-decoration: none; }
    .emesa-logo { max-width: 110px; max-height: 42px; object-fit: contain; }
    main { width: 100%; max-width: none; box-sizing: border-box; margin: 20px 0; padding: 0 16px 32px; }
    .filter-panel, .results-panel { background: white; border: 1px solid #b3d6ee; border-radius: 12px; box-shadow: 0 4px 14px #245d8520; }
    .filter-panel { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; padding: 18px; }
    .filter-group { width: min(280px, 100%); }
    .filter-group label { display: block; margin: 0 0 6px; font-weight: 700; }
    .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: 1px solid #2879b9; border-radius: 8px; padding: 10px 16px; background: #3880c7; color: white; font-weight: 700; cursor: pointer; }
    .btn.secondary { background: white; color: #2879b9; }
    .btn:disabled { opacity: .65; cursor: wait; }
    .results-panel { margin-top: 16px; overflow: hidden; }
    .results-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #d9e8f3; }
    .results-tools { display: flex; align-items: center; gap: 8px; }
    #summary { font-weight: 700; }
    #search { width: min(320px, 100%); border: 1px solid #9bbbd3; border-radius: 7px; padding: 9px 11px; }
    #filterRead { min-width: 150px; border: 1px solid #9bbbd3; border-radius: 7px; padding: 9px 11px; background: white; color: #315f83; }
    #filterRead:disabled { opacity: .65; }
    .status { padding: 28px 16px; text-align: center; color: #56748e; }
    .order-card { border-bottom: 1px solid #d9e8f3; }
    .order-heading { display: flex; align-items: center; gap: 12px; margin: 0; padding: 8px 16px; color: #245d8b; background: var(--order-background, #edf7ff); font-size: 1.02rem; }
    .order-heading.is-read { --order-background: #e6f4ea; --order-hover: #d4ebdc; }
    .order-heading.is-unread { --order-background: #fde9e8; --order-hover: #f8d7d5; }
    .order-heading:hover { background: var(--order-hover, #e4f2fd); }
    .order-title { flex: 0 0 166px; }
    .order-count { margin-left: 8px; color: #66839a; font-size: .9rem; font-weight: 400; }
    .order-status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: #56748e; font-size: .82rem; font-weight: 600; }
    .semaphore { display: none; }
    .order-weight { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: .85rem; font-weight: 600; }
    .weight-input { width: 104px; box-sizing: border-box; border: 1px solid #9bbbd3; border-radius: 5px; padding: 5px 7px; color: #315f83; font: inherit; text-align: right; }
    .weight-input:focus { outline: 2px solid #3880c7; outline-offset: 1px; }
    .weight-input[aria-invalid="true"] { border-color: #bd3744; }
    .weight-input:disabled { opacity: .65; cursor: wait; }
    .weight-message { max-width: 250px; font-size: .78rem; font-weight: 400; overflow-wrap: anywhere; }
    .weight-message.error { color: #bd3744; }
    .detail-toggle { flex: 0 0 auto; border: 1px solid #2879b9; border-radius: 7px; padding: 7px 12px; background: white; color: #2879b9; font-weight: 700; cursor: pointer; }
    .detail-toggle:disabled { opacity: .65; cursor: wait; }
    .order-detail[hidden] { display: none; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; margin-top: 0; }
    th, td { padding: 9px 11px; border-bottom: 1px solid #e4edf4; text-align: left; white-space: nowrap; }
    th { position: static; background: #f7fbfe; color: #315f83; }
    tbody tr.is-read { background: #e6f4ea; }
    tbody tr.is-unread { background: #fde9e8; }
    tbody tr:hover { background: #d4ebdc; }
    tbody tr.is-unread:hover { background: #f8d7d5; }
    .bool { text-align: center; }
    .read-checkbox { width: 16px; height: 16px; margin: 0; accent-color: #20a45a; vertical-align: middle; opacity: 1; cursor: default; }
    .material-tree { display: grid; gap: 9px; padding: 12px 16px; }
    .material-node { overflow: hidden; border: 1px solid #d4e4f0; border-radius: 8px; background: var(--order-background, #fff); }
    .material-node.is-read { --order-background: #e6f4ea; --order-hover: #d4ebdc; }
    .material-node.is-unread { --order-background: #fde9e8; --order-hover: #f8d7d5; }
    .material-node > summary, .material-summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--order-background); color: #245d8b; cursor: pointer; list-style: none; }
    .material-node > summary::-webkit-details-marker { display: none; }
    .material-chevron { width: 8px; height: 8px; flex: 0 0 8px; margin: 0 3px 3px 2px; border-right: 2px solid #52738e; border-bottom: 2px solid #52738e; transform: rotate(45deg); }
    .material-chevron.hidden { visibility: hidden; }
    .material-title { display: inline-flex; flex: 1 1 auto; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .material-title small { color: #56748e; font-size: .74rem; font-weight: 700; text-transform: uppercase; }
    .material-title strong { overflow-wrap: anywhere; }
    .material-state { margin-left: auto; color: #315f83; font-size: .86rem; font-weight: 700; }
    .material-line { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; padding: 10px 14px; border-top: 1px solid #e3edf4; background: var(--order-background); color: #56748e; font-size: .88rem; }
    .material-line strong { color: #315f83; }
    .material-children { display: grid; gap: 8px; padding: 0 10px 10px 22px; }
    .material-context { padding: 7px 13px; background: var(--order-background); color: #71869a; font-size: .8rem; font-style: italic; }
    .missing-action { border: 1px solid #bd3744; border-radius: 6px; padding: 5px 9px; background: #fff; color: #bd3744; font-weight: 700; cursor: pointer; }
    .missing-action.active { border-color: #23804b; color: #23804b; }
    .missing-action:disabled { opacity: .6; cursor: wait; }
    .missing-dialog { width: min(500px, calc(100% - 32px)); max-height: 85vh; box-sizing: border-box; padding: 0; border: 0; border-radius: 12px; background: white; color: #244f75; box-shadow: 0 8px 32px #0005; }
    .missing-dialog::backdrop { background: #0008; }
    .missing-dialog-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; background: #3880c7; color: white; }
    .missing-dialog-header h2 { margin: 0; font-size: 1.2rem; }
    .missing-dialog-close { border: 0; background: transparent; color: white; font-size: 1.5rem; cursor: pointer; }
    .missing-dialog-close:disabled { opacity: .65; cursor: wait; }
    .missing-dialog-body { padding: 20px; }
    .missing-dialog-body p { margin: 0 0 16px; overflow-wrap: anywhere; }
    .missing-dialog-body label { display: block; margin-bottom: 8px; font-weight: 700; }
    .missing-dialog-body textarea { display: block; width: 100%; min-height: 110px; box-sizing: border-box; padding: 10px; border: 1px solid #9bbbd3; border-radius: 7px; resize: vertical; font: inherit; color: #244f75; }
    .missing-dialog-body textarea:focus { outline: 2px solid #3880c7; outline-offset: 2px; }
    .missing-dialog-help { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: .82rem; color: #56748e; }
    #missingReasonCount { white-space: nowrap; }
    .missing-dialog-body .missing-dialog-error { margin: 14px 0 0; color: #bd3744; }
    .missing-dialog-footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 16px 20px; border-top: 1px solid #d9e8f3; }
    #userSessionWidget { position: fixed !important; right: 15px !important; bottom: 15px !important; left: auto !important; top: auto !important; z-index: 10; }
    @media (max-width: 680px) { .header { padding: 0 8px; } .emesa-logo { max-width: 76px; } .filter-group { width: 100%; } .filter-actions { width: 100%; } .filter-actions .btn { flex: 1; } .results-toolbar { align-items: stretch; flex-direction: column; } .results-tools { flex-direction: column; align-items: stretch; } #search, #filterRead { width: 100%; } .order-heading { flex-wrap: wrap; } .order-title { flex: 1 1 auto; } .order-status { flex-basis: 100%; margin-left: 0; } .order-weight { flex: 1 1 auto; } }
  </style>
</head>
<body>
  <header class="header">
    <button class="header-action" onclick="history.back()" aria-label="Volver">‹</button>
    <a class="header-action" href="/templates/generales/PuestosCAB.html" aria-label="Inicio">⌂</a>
    <div class="header-title">PICKING CAB</div>
    <img class="emesa-logo" src="/IMAGENES/Logo_EMESA.png" alt="EMESA">
  </header>
  <div id="userSessionWidget" class="user-session-widget"></div>
  <main>
    <section class="filter-panel" aria-label="Filtros de año y semana">
      <div class="filter-group">
        <label for="filtroAno">Año</label>
        <div id="filtroAno" class="selector-multiple" data-campo="ano">
          <button type="button" class="selector-boton" aria-haspopup="listbox" aria-expanded="false"><span class="selector-resumen">Todos los años</span><span class="selector-clear-icon" aria-hidden="true"></span><span class="selector-icono" aria-hidden="true"></span></button>
          <div class="selector-panel" role="listbox" aria-multiselectable="true" hidden><ul class="selector-opciones"></ul></div>
        </div>
      </div>
      <div class="filter-group">
        <label for="filtroSemana">Semana</label>
        <div id="filtroSemana" class="selector-multiple" data-campo="semana">
          <button type="button" class="selector-boton" aria-haspopup="listbox" aria-expanded="false"><span class="selector-resumen">Todas las semanas</span><span class="selector-clear-icon" aria-hidden="true"></span><span class="selector-icono" aria-hidden="true"></span></button>
          <div class="selector-panel" role="listbox" aria-multiselectable="true" hidden><ul class="selector-opciones"></ul></div>
        </div>
      </div>
      <div class="filter-actions">
        <button id="aplicar" class="btn" type="button">Aplicar filtros</button>
        <button id="limpiar" class="btn secondary" type="button">Limpiar</button>
      </div>
    </section>

    <section class="results-panel" aria-live="polite">
      <div class="results-toolbar">
        <div id="summary">Selecciona año y semana y aplica los filtros.</div>
        <div class="results-tools">
          <select id="filterRead" aria-label="Filtrar materiales por lectura" disabled>
            <option value="todos">Todos los materiales</option>
            <option value="leidos">Leídos</option>
            <option value="no-leidos">No leídos</option>
          </select>
          <input id="search" type="search" placeholder="Buscar pedido..." aria-label="Buscar pedido" disabled>
        </div>
      </div>
      <div id="results"><div class="status">Sin filtros aplicados.</div></div>
    </section>
  </main>
  <dialog id="missingDialog" class="missing-dialog" aria-labelledby="missingDialogTitle" aria-describedby="missingDialogMaterial">
    <form id="missingForm">
      <div class="missing-dialog-header">
        <h2 id="missingDialogTitle">Confirmar faltante de Picking</h2>
        <button id="missingClose" class="missing-dialog-close" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <div class="missing-dialog-body">
        <p id="missingDialogMaterial"></p>
        <label for="missingReason">Motivo del faltante (opcional)</label>
        <textarea id="missingReason" name="texto_faltante" rows="4" maxlength="500" placeholder="Escribe el motivo del faltante..." aria-describedby="missingReasonHelp missingReasonCount"></textarea>
        <div class="missing-dialog-help"><span id="missingReasonHelp">Puedes confirmar sin introducir un motivo.</span><span id="missingReasonCount">0 / 500</span></div>
        <p id="missingError" class="missing-dialog-error" role="alert" hidden></p>
      </div>
      <div class="missing-dialog-footer">
        <button id="missingCancel" class="btn secondary" type="button">Cancelar</button>
        <button id="missingConfirm" class="btn" type="submit">Confirmar faltante</button>
      </div>
    </form>
  </dialog>
  <script type="module">
    import { initSelectorMultiple } from '/assets/js/selector-multiple.js';

    const anoSelector = initSelectorMultiple(document.getElementById('filtroAno'), {
      placeholder: 'Todos los años', placeholderBuscar: 'Buscar año...', textoSinDatos: 'Cargando...'
    });
    const semanaSelector = initSelectorMultiple(document.getElementById('filtroSemana'), {
      placeholder: 'Todas las semanas', placeholderBuscar: 'Buscar semana...', textoSinDatos: 'Cargando...'
    });
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    const search = document.getElementById('search');
    const filterRead = document.getElementById('filterRead');
    const applyButton = document.getElementById('aplicar');
    const missingDialog = document.getElementById('missingDialog');
    const missingReason = document.getElementById('missingReason');
    const missingConfirm = document.getElementById('missingConfirm');
    const missingCancel = document.getElementById('missingCancel');
    const missingClose = document.getElementById('missingClose');
    const missingError = document.getElementById('missingError');
    let faltantePendiente = null;
    let guardandoFaltante = false;
    let pedidosActuales = [];
    let filtrosActuales = { anos: [], semanas: [] };
    let pedidosAbort = null;
    let detalleAbort = null;
    const detalleCache = new Map();

    async function cargarOpciones(url, key, selector, label) {
      try {
        const response = await fetch(url, { headers: { Accept: 'application/json' } });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'No se pudieron cargar los filtros.');
        selector.setOptions((data[key] || []).map(valor => ({ value: String(valor), label: label(String(valor)) })));
      } catch (error) {
        selector.setOptions([]);
        console.error(error);
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function formatearPeso(value) {
      return String(value ?? '').replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '').replace('.', ',');
    }

    function pesoValido(value) {
      const normalized = value.trim().replace(',', '.');
      return !normalized || (/^(?:[0-9]+(?:\.[0-9]{1,3})?|\.[0-9]{1,3})$/.test(normalized) && Number(normalized) <= 999999999.999);
    }

    async function guardarPeso(input) {
      const card = input.closest('.order-card');
      const pedido = card?.dataset.pedido;
      const order = pedidosActuales.find(item => String(item.NUMEROPEDIDO) === pedido);
      if (!order || order.PESO_EDITABLE === false || input.dataset.saving === '1') return;
      const texto = input.value.trim();
      const message = card.querySelector('.weight-message');
      if (!pesoValido(texto)) {
        input.setAttribute('aria-invalid', 'true'); message.textContent = 'Peso no válido (máximo 3 decimales).'; message.classList.add('error'); return;
      }
      input.setAttribute('aria-invalid', 'false'); message.classList.remove('error');
      const previous = formatearPeso(order.PESO_KG);
      if ((!texto && !previous) || (texto && previous && Number(texto.replace(',', '.')) === Number(previous.replace(',', '.')))) { input.value = previous; message.textContent = ''; return; }
      input.dataset.saving = '1'; input.disabled = true; message.textContent = 'Guardando...';
      try {
        const response = await fetch(`/api/picking-pedidos/${encodeURIComponent(pedido)}/peso`, { method: 'PUT', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ peso_kg: texto || null, ...filtrosActuales }) });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'No se pudo guardar el peso.');
        order.PESO_KG = data.PESO_KG; input.value = formatearPeso(data.PESO_KG); message.textContent = 'Guardado';
      } catch (error) { message.textContent = error.message; message.classList.add('error'); input.setAttribute('aria-invalid', 'true'); }
      finally { input.dataset.saving = ''; input.disabled = false; }
    }

    function renderizarPedidos(pedidos) {
      const texto = search.value.trim().toLocaleLowerCase();
      const filtrados = texto ? pedidos.filter(pedido => String(pedido.NUMEROPEDIDO ?? '').toLocaleLowerCase().includes(texto)) : pedidos;
      if (!filtrados.length) {
        results.innerHTML = `<div class="status">${pedidos.length ? 'No hay coincidencias con la búsqueda.' : 'No hay pedidos con materiales para los filtros seleccionados.'}</div>`;
        return;
      }

      results.innerHTML = filtrados.map(pedido => `
        <section class="order-card" data-pedido="${esc(pedido.NUMEROPEDIDO)}">
          <h2 class="order-heading ${pedido.LEIDO ? 'is-read' : 'is-unread'}">
            <span class="order-title">Pedido ${esc(pedido.NUMEROPEDIDO)}<span class="order-count">${esc(pedido.TOTAL_MATERIALES)} materiales</span></span>
            <label class="order-weight"><input class="weight-input" type="text" inputmode="decimal" maxlength="32" placeholder="Peso" value="${esc(formatearPeso(pedido.PESO_KG))}" aria-label="Peso en kg del pedido ${esc(pedido.NUMEROPEDIDO)}" title="Peso en kg. Se guarda al salir o pulsar Intro. Vacío para borrar." ${pedido.PESO_EDITABLE === false ? 'disabled' : ''}><span>kg</span><span class="weight-message" role="status"></span></label>
            <span class="order-status"><i class="semaphore ${pedido.LEIDO ? 'green' : 'red'}"></i>${pedido.LEIDO ? 'Completo' : 'Pendiente'}</span>
            <button class="detail-toggle" type="button" data-pedido="${esc(pedido.NUMEROPEDIDO)}">Ver materiales</button>
          </h2>
          <div class="order-detail" hidden><div class="status">Abre el pedido para cargar sus materiales.</div></div>
        </section>`).join('');
    }

    function renderizarDetalle(registros) {
      if (!registros.length) return '<div class="status">El pedido no tiene materiales.</div>';
      const criterio = filterRead.value;
      const passes = row => criterio === 'todos' || (criterio === 'leidos' ? esLeido(row.LEIDO) : !esLeido(row.LEIDO));
      const byId = new Map(registros.map(row => [String(row.ID_PICKING), row]));
      const children = new Map();
      registros.forEach(row => { const parent = String(row.IDPADRESUBOPERACIONES ?? '').trim(); if (parent && parent !== '0') { if (!children.has(parent)) children.set(parent, []); children.get(parent).push(row); } });
      const rendered = new Set();
      const renderNode = (row, depth, ancestors = new Set()) => {
        const id = String(row.ID_PICKING);
        if (ancestors.has(id)) return '';
        const next = new Set(ancestors); next.add(id); rendered.add(id);
        const childHtml = (children.get(id) || []).map(child => renderNode(child, depth + 1, next)).join('');
        const ownVisible = passes(row);
        if (!ownVisible && !childHtml) return '';
        const leido = esLeido(row.LEIDO);
        const kind = depth === 0 ? 'Padre' : depth === 1 ? 'Componente' : 'Subcomponente';
        const heading = `<span class="material-chevron${childHtml ? '' : ' hidden'}"></span><span class="material-title"><small>${kind}</small><strong>${esc(row.CODIGOPICKING)}${row.DESCRIPCIONPICKING ? ` / ${esc(row.DESCRIPCIONPICKING)}` : ''}</strong></span><span class="material-state">${leido ? 'Completo' : 'Pendiente'}</span>`;
        const content = ownVisible ? `<div class="material-line"><span>Cantidad: <strong>${esc(row.CANTIDADPICKING)}</strong></span><span>Fichada: <strong>${esc(row.CANTIDADPICKINGFICHADA)}</strong></span>${row.CODIGOLEIDO ? `<span>Código leído: <strong>${esc(row.CODIGOLEIDO)}</strong></span>` : ''}<label><input class="read-checkbox" type="checkbox" disabled ${leido ? 'checked' : ''}> Leído</label><button type="button" class="missing-action ${row.FALTANTE ? 'active' : ''}" data-linea="${esc(row.ID_PICKING)}" data-faltante="${row.FALTANTE ? 'true' : 'false'}" ${leido ? 'disabled title="La línea se ha leído"' : ''}>${row.FALTANTE ? 'Quitar faltante' : 'Marcar faltante'}</button></div>` : '<div class="material-context">Material oculto por el filtro.</div>';
        return childHtml ? `<details class="material-node ${leido ? 'is-read' : 'is-unread'} depth-${Math.min(depth, 2)}"><summary>${heading}</summary>${content}<div class="material-children">${childHtml}</div></details>` : `<div class="material-node ${leido ? 'is-read' : 'is-unread'} depth-${Math.min(depth, 2)}"><div class="material-summary">${heading}</div>${content}</div>`;
      };
      const roots = registros.filter(row => { const parent = String(row.IDPADRESUBOPERACIONES ?? '').trim(); return !parent || parent === '0' || !byId.has(parent); });
      let tree = roots.map(row => renderNode(row, 0)).join('');
      tree += registros.filter(row => !rendered.has(String(row.ID_PICKING))).map(row => renderNode(row, 0)).join('');
      return tree ? `<div class="material-tree">${tree}</div>` : '<div class="status">No hay materiales que coincidan con el filtro de lectura.</div>';
    }

    function esLeido(valor) {
      return valor === true || valor === 1 || ['true', '1'].includes(String(valor).toLowerCase());
    }

    function actualizarFiltroLectura() {
      for (const [pedido, registros] of detalleCache) {
        const card = Array.from(results.querySelectorAll('.order-card')).find(item => item.dataset.pedido === pedido);
        if (card && !card.querySelector('.order-detail').hidden) {
          card.querySelector('.order-detail').innerHTML = renderizarDetalle(registros);
        }
      }
    }

    async function aplicarFiltros() {
      const anos = anoSelector.getSelected();
      const semanas = semanaSelector.getSelected();
      if (!anos.length && !semanas.length) {
        alert('Selecciona al menos un año o una semana.');
        return;
      }
      const params = new URLSearchParams();
      anos.forEach(valor => params.append('anos[]', valor));
      semanas.forEach(valor => params.append('semanas[]', valor));
      applyButton.disabled = true;
      results.innerHTML = '<div class="status">Cargando materiales...</div>';
      summary.textContent = 'Consultando pedidos...';
      filtrosActuales = { anos, semanas };
      if (pedidosAbort) pedidosAbort.abort();
      pedidosAbort = new AbortController();
      try {
        const response = await fetch(`/api/picking-pedidos?${params.toString()}`, { headers: { Accept: 'application/json' }, signal: pedidosAbort.signal });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'Error al cargar pedidos.');
        pedidosActuales = data.pedidos || [];
        if (!document.body.contains(results)) return;
        detalleCache.clear();
        summary.textContent = `${data.total_pedidos} pedidos`;
        search.disabled = false;
        filterRead.disabled = false;
        renderizarPedidos(pedidosActuales);
      } catch (error) {
        if (error.name === 'AbortError') return;
        pedidosActuales = [];
        summary.textContent = 'No se pudieron cargar los materiales.';
        results.innerHTML = `<div class="status">${esc(error.message)}</div>`;
      } finally {
        applyButton.disabled = false;
      }
    }

    document.getElementById('aplicar').addEventListener('click', aplicarFiltros);
    document.getElementById('limpiar').addEventListener('click', () => {
      anoSelector.clear();
      semanaSelector.clear();
      search.value = '';
      search.disabled = true;
      filterRead.value = 'todos';
      filterRead.disabled = true;
      pedidosActuales = [];
      filtrosActuales = { anos: [], semanas: [] };
      detalleCache.clear();
      summary.textContent = 'Selecciona año y semana y aplica los filtros.';
      results.innerHTML = '<div class="status">Sin filtros aplicados.</div>';
    });
    search.addEventListener('input', () => renderizarPedidos(pedidosActuales));
    filterRead.addEventListener('change', actualizarFiltroLectura);
    results.addEventListener('input', event => {
      if (!event.target.matches('.weight-input')) return;
      event.target.setAttribute('aria-invalid', 'false');
      const message = event.target.closest('.order-card').querySelector('.weight-message'); message.textContent = 'Sin guardar'; message.classList.remove('error');
    });
    results.addEventListener('change', event => { if (event.target.matches('.weight-input')) guardarPeso(event.target); });
    results.addEventListener('keydown', event => { if (event.key === 'Enter' && event.target.matches('.weight-input')) { event.preventDefault(); guardarPeso(event.target); event.target.blur(); } });
    async function guardarFaltante(missingButton, faltante, textoFaltante = '') {
      const idPicking = missingButton.dataset.linea;
      missingButton.disabled = true;
      try {
        const response = await fetch(`/api/picking-lineas/${encodeURIComponent(idPicking)}/faltante`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ faltante, texto_faltante: textoFaltante })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'No se pudo actualizar el faltante.');
        for (const [pedido, lineas] of detalleCache) {
          const linea = lineas.find(registro => String(registro.ID_PICKING) === String(idPicking));
          if (!linea) continue;
          linea.FALTANTE = faltante;
          const card = Array.from(results.querySelectorAll('.order-card')).find(item => item.dataset.pedido === pedido);
          if (card) {
            card.querySelector('.order-detail').innerHTML = renderizarDetalle(lineas);
            const leido = lineas.every(registro => esLeido(registro.LEIDO));
            card.querySelector('.order-status').innerHTML = `<i class="semaphore ${leido ? 'green' : 'red'}" role="img" aria-label="${leido ? 'Todas las líneas leídas' : 'Hay líneas sin leer'}"></i>${leido ? 'Completo' : 'Pendiente'}`;
            const pedidoData = pedidosActuales.find(item => String(item.NUMEROPEDIDO) === pedido);
            if (pedidoData) pedidoData.LEIDO = leido;
          }
          break;
        }
      } finally {
        missingButton.disabled = false;
      }
    }

    function abrirModalFaltante(missingButton) {
      const pedido = missingButton.closest('.order-card').dataset.pedido;
      const linea = (detalleCache.get(pedido) || []).find(registro => String(registro.ID_PICKING) === missingButton.dataset.linea);
      faltantePendiente = missingButton;
      document.getElementById('missingDialogMaterial').textContent = `Pedido ${pedido} · ${linea?.CODIGOPICKING || ''} — ${linea?.DESCRIPCIONPICKING || ''}`;
      missingReason.value = '';
      document.getElementById('missingReasonCount').textContent = '0 / 500';
      missingError.hidden = true;
      missingDialog.showModal();
      missingReason.focus();
    }

    missingReason.addEventListener('input', () => {
      document.getElementById('missingReasonCount').textContent = `${missingReason.value.length} / 500`;
    });
    [missingCancel, missingClose].forEach(button => button.addEventListener('click', () => {
      if (!guardandoFaltante) missingDialog.close();
    }));
    missingDialog.addEventListener('cancel', event => {
      if (guardandoFaltante) event.preventDefault();
    });
    missingDialog.addEventListener('close', () => { faltantePendiente = null; });
    document.getElementById('missingForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (!faltantePendiente || guardandoFaltante) return;
      guardandoFaltante = true;
      [missingConfirm, missingCancel, missingClose, missingReason].forEach(control => { control.disabled = true; });
      missingConfirm.textContent = 'Guardando...';
      missingError.hidden = true;
      try {
        await guardarFaltante(faltantePendiente, true, missingReason.value.trim());
        missingDialog.close();
      } catch (error) {
        missingError.textContent = error.message;
        missingError.hidden = false;
      } finally {
        guardandoFaltante = false;
        [missingConfirm, missingCancel, missingClose, missingReason].forEach(control => { control.disabled = false; });
        missingConfirm.textContent = 'Confirmar faltante';
      }
    });

    results.addEventListener('click', async event => {
      const missingButton = event.target.closest('.missing-action');
      if (missingButton) {
        if (missingButton.dataset.faltante !== 'true') {
          abrirModalFaltante(missingButton);
        } else {
          try {
            await guardarFaltante(missingButton, false);
          } catch (error) {
            alert(error.message);
          }
        }
        return;
      }
      const button = event.target.closest('.detail-toggle');
      if (!button) return;
      const pedido = button.dataset.pedido;
      const card = button.closest('.order-card');
      const detail = card.querySelector('.order-detail');
      if (!detail.hidden) {
        detail.hidden = true;
        button.textContent = 'Ver materiales';
        return;
      }
      detail.hidden = false;
      if (detalleCache.has(pedido)) {
        detail.innerHTML = renderizarDetalle(detalleCache.get(pedido));
        button.textContent = 'Ocultar materiales';
        return;
      }

      button.disabled = true;
      button.textContent = 'Cargando...';
      detail.innerHTML = '<div class="status">Cargando materiales del pedido...</div>';
      try {
        if (detalleAbort) detalleAbort.abort();
        detalleAbort = new AbortController();
        const response = await fetch(`/api/picking-pedidos/${encodeURIComponent(pedido)}`, { headers: { Accept: 'application/json' }, signal: detalleAbort.signal });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'Error al cargar los materiales.');
        const registros = data.registros || [];
        if (!document.body.contains(detail)) return;
        detalleCache.set(pedido, registros);
        detail.innerHTML = renderizarDetalle(registros);
        button.textContent = 'Ocultar materiales';
      } catch (error) {
        if (error.name === 'AbortError') return;
        detail.innerHTML = `<div class="status">${esc(error.message)}</div>`;
        button.textContent = 'Reintentar';
      } finally {
        button.disabled = false;
      }
    });
    await Promise.all([
      cargarOpciones('/api/anos', 'anos', anoSelector, value => value),
      cargarOpciones('/api/semanas', 'semanas', semanaSelector, value => `Semana ${value}`)
    ]);
  </script>
  <script src="/assets/css/loginModal.js?v=20261002-cab-breadcrumb-3"></script>
</body>
