<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Faltantes - CAB</title>
  <link rel="stylesheet" href="/assets/css/global-styles.css?v=1.0"><link rel="stylesheet" href="/assets/css/loginModal.css">
  <style>
    :root{--accent:#3880c7;--accent-dark:#24649f;--bg:#edf6fc;--border:#b8d8ee;--ink:#214d75;--shadow:0 10px 28px rgba(35,91,135,.12)}
    *{box-sizing:border-box}.is-hidden{display:none!important}body{margin:0;background:linear-gradient(180deg,#e7f3fb 0,#f7fbfe 42%,#edf6fc 100%);font:14px 'Segoe UI',Arial,sans-serif;color:var(--ink)}
    .header{height:80px;background:linear-gradient(135deg,#347bb8,#4e96d2);display:flex;align-items:center;color:#fff;box-shadow:0 5px 18px rgba(37,91,137,.22)}.header-title{flex:1;text-align:center;font-size:21px;font-weight:700;letter-spacing:.3px}.emesa-logo{height:50px;margin:0 20px}.back-icon,.home-icon{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;cursor:pointer;margin:0 6px;width:38px;height:38px;font-size:24px;line-height:1}.back-icon:hover,.home-icon:hover{background:rgba(255,255,255,.24)}
    main{padding:18px 20px 30px;max-width:2200px;margin:auto}.view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;padding:12px 16px;background:rgba(255,255,255,.9);border:1px solid #9ac9e7;border-radius:14px;box-shadow:var(--shadow)}.view-label{font-weight:700;color:#2b628d}.view-switch{display:flex;align-items:center;gap:10px;cursor:pointer;color:#52738e;font-weight:600;user-select:none}.view-switch input{position:absolute;opacity:0;pointer-events:none}.switch-track{width:48px;height:27px;padding:3px;background:#b8cad8;border-radius:99px;transition:background .2s;box-shadow:inset 0 1px 3px #7890a333}.switch-track::after{content:'';display:block;width:21px;height:21px;border-radius:50%;background:white;box-shadow:0 2px 5px #254b6866;transition:transform .2s}.view-switch input:checked+.switch-track{background:#3880c7}.view-switch input:checked+.switch-track::after{transform:translateX(21px)}.view-switch input:focus-visible+.switch-track{outline:3px solid #3880c744;outline-offset:2px}.switch-mode{min-width:88px;transition:color .2s}.view-switch input:not(:checked)~.mode-current,.view-switch input:checked~.mode-history{color:#28618d;font-weight:800}.btn{padding:10px 17px;border:1px solid var(--accent);border-radius:9px;background:linear-gradient(180deg,#438fd2,#2f76b8);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 4px 10px rgba(56,128,199,.18)}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn.secondary{background:#fff;color:#2873b7;box-shadow:none}
    .status{margin:12px 0 10px;padding:11px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;color:#28618d;font-weight:700;box-shadow:0 4px 14px rgba(35,91,135,.07)}.filters-actions{display:flex;gap:8px;align-items:center}.filters-actions .btn{padding:8px 13px;font-size:13px}.table-wrap{overflow:auto;padding:0;background:rgba(255,255,255,.92);border:1px solid #a9cde5;border-radius:12px;box-shadow:var(--shadow)}.table{margin-top:0;border-collapse:separate;border-spacing:0;width:100%;min-width:1550px}.table thead{position:sticky;top:0;z-index:3}.table th{background:linear-gradient(180deg,#3f86c9,#347abd);color:#fff;padding:10px 9px;text-align:left;white-space:nowrap;font-size:13px}.table thead tr:first-child th:first-child{border-top-left-radius:11px}.table thead tr:first-child th:last-child{border-top-right-radius:11px}.table th input{display:block;width:100%;min-width:80px;margin-top:8px;padding:7px 8px;border:1px solid #b7d9ef;border-radius:7px;background:#fff;color:#214d75;font:12px 'Segoe UI',Arial,sans-serif;outline:0}.table th input:focus{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55)}.table td{padding:11px 9px;border-right:1px solid #d5e7f3;border-bottom:1px solid #d5e7f3;vertical-align:middle}.table tbody tr:nth-child(even){background:#f4f9fd}.table tbody tr:hover{background:#e8f4fc}.pill{display:inline-flex;background:#e3334b;color:#fff;padding:7px 11px;border-radius:999px;font-weight:700;cursor:help;box-shadow:0 3px 8px rgba(227,51,75,.2)}.history-state{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e8f5ed;color:#24734a;font-weight:700}.history-state.closed{background:#eef2f6;color:#60758a}.empty{padding:30px;text-align:center;background:#fff;color:#6b879d;border-radius:0 0 12px 12px;font-weight:600}
    @media(max-width:800px){main{padding:12px}.header{height:64px}.header-title{font-size:17px}.emesa-logo{height:38px;margin-right:10px}.filters select{min-width:130px}}
  </style>
</head>
<body>
  <header class="header"><button class="back-icon" onclick="history.back()" aria-label="Volver">‹</button><button class="home-icon" onclick="window.location.href='/templates/generales/PuestosCAB.html'" aria-label="Inicio">⌂</button><div class="header-title">FALTANTES CAB</div><img class="emesa-logo" src="/IMAGENES/Logo_EMESA.png" alt="EMESA"></header>
  <main>
    <section class="view-toolbar"><span class="view-label">Vista de faltantes</span><label class="view-switch" for="historyToggle"><span class="switch-mode mode-current">Faltantes Vigentes</span><input type="checkbox" id="historyToggle" role="switch" aria-checked="false" aria-label="Mostrar histórico de faltantes"><span class="switch-track" aria-hidden="true"></span><span class="switch-mode mode-history">Histórico</span></label><button class="btn" id="exportar">📊 Exportar a Excel</button></section>
    <div class="status" id="status">Cargando faltantes vigentes...</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>NúmeroPedido</th><th>Año</th><th>Semana</th><th>Operario</th><th>CódigoPieza</th><th>Descripción</th><th>Modelo</th><th>Tiempo total</th><th>Codlinea</th><th>Puesto</th><th>En progreso</th><th>Fecha faltante</th><th>Vigencia</th><th>Estado</th><th>Motivo faltante</th></tr><tr class="filters-row"><th><input data-column="0" placeholder="Buscar número..."></th><th><input data-column="1" placeholder="Buscar año..."></th><th><input data-column="2" placeholder="Buscar semana..."></th><th><input data-column="3" placeholder="Buscar operario..."></th><th><input data-column="4" placeholder="Buscar código..."></th><th><input data-column="5" placeholder="Buscar descripción..."></th><th><input data-column="6" placeholder="Buscar modelo..."></th><th><input data-column="7" placeholder="Buscar tiempo..."></th><th><input data-column="8" placeholder="Buscar codlinea..."></th><th><input data-column="9" placeholder="Buscar puesto..."></th><th><input data-column="10" placeholder="Buscar progreso..."></th><th><input data-column="11" placeholder="Buscar fecha..."></th><th><input data-column="12" placeholder="Buscar vigencia..."></th><th><input data-column="13" placeholder="Buscar estado..."></th><th><input data-column="14" placeholder="Buscar motivo..."></th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>No hay registros de faltantes para mostrar.</div></div>
  </main>
  <script>
    const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let currentMode='vigentes';
    async function load(){currentMode=$('historyToggle').checked?'historico':'vigentes';$('historyToggle').setAttribute('aria-checked',String(currentMode==='historico'));$('status').textContent=`Cargando ${currentMode==='vigentes'?'faltantes vigentes':'histórico'}...`;try{const r=await fetch(`/api/faltantes?modo=${currentMode}`),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'No se pudieron cargar los faltantes');$('body').innerHTML=d.faltantes.map(x=>{const date=String(x.fecha||'').slice(0,10);const vigencia=x.vigente?'Vigente':'Cerrado';return `<tr><td>${esc(x.numeroPedido)}</td><td>${esc(x.ano)}</td><td>${esc(x.semana)}</td><td>${esc(x.operario||'N/A')}</td><td>${esc(x.codigoPieza)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.modelo)}</td><td>${esc(x.tiempoTotal)} min</td><td>${esc(x.codlinea)}</td><td><b>${esc(x.puesto)}</b></td><td>${esc(x.progreso)}%</td><td>${esc(date)}</td><td><span class="history-state ${x.vigente?'':'closed'}">${vigencia}</span></td><td><span class="pill" title="${esc(x.motivo||'Sin motivo indicado')}">${esc(x.estado||'Faltante')}</span></td><td>${esc(x.motivo||'')}</td></tr>`}).join('');$('empty').hidden=!!d.total;$('empty').textContent=currentMode==='vigentes'?'No hay faltantes vigentes.':'No hay registros históricos de faltantes.';$('status').textContent=`Mostrando ${d.total} ${currentMode==='vigentes'?'faltante vigente':'registro histórico de faltante'}${d.total===1?'':'s'}`;applyColumnFilters()}catch(error){$('status').textContent=error.message;$('body').innerHTML='';$('empty').hidden=false}}
    function applyColumnFilters(){const inputs=[...document.querySelectorAll('.table th input')];const rows=[...$('body').rows];rows.forEach(row=>{row.style.display=inputs.every(input=>{const value=input.value.trim().toLowerCase();return !value||row.cells[Number(input.dataset.column)].textContent.toLowerCase().includes(value)})?'':'none'});const visible=rows.filter(row=>row.style.display!=='none').length;$('status').textContent=`Mostrando ${visible} de ${rows.length} ${currentMode==='vigentes'?'faltantes vigentes':'registros históricos'}`}
    document.querySelectorAll('.table th input').forEach(input=>input.addEventListener('input',applyColumnFilters));
    function exportarExcel(){const originalTable=document.querySelector('.table');if(!originalTable){alert('No hay una tabla disponible para exportar.');return}const table=originalTable.cloneNode(true);table.querySelector('.filters-row')?.remove();table.querySelectorAll('tbody tr').forEach(row=>{if(row.style.display==='none')row.remove()});const html=`<html><head><meta charset="UTF-8"></head><body>${table.outerHTML}</body></html>`;const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`faltantes_${new Date().toISOString().slice(0,10)}.xls`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    $('historyToggle').addEventListener('change',load);$('exportar').onclick=exportarExcel;document.querySelectorAll('.table th input').forEach(input=>input.addEventListener('input',applyColumnFilters));load();
  </script>
</body></html>
